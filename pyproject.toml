[project]
name = "digital-payment-pressure-bank-margins"
version = "0.1.0"
description = "Academic research portfolio examining digital payment pressure and bank net fee margins in an ASEAN-3 panel."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "linearmodels>=7.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "python-docx>=1.2.0",
    "requests>=2.33.1",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]
